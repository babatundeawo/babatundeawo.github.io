# Builds, checks and publishes the site to GitHub Pages.
# Runs when something is saved to the main branch, or when you press "Run workflow".
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never run two deployments at once; a newer one waits for the current one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js (long-term support line)
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # Tells us the real public address (including a custom domain, if one is set).
      - name: Read the GitHub Pages settings
        id: pages
        uses: actions/configure-pages@v6

      - name: Assemble the site into dist/
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: node scripts/build.mjs

      - name: Check links, manifest, service worker and security rules
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: node scripts/check-site.mjs dist

      - name: Package the site for GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # Reports only: nothing in this job can stop a deployment.
  quality:
    name: Quality report
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js (long-term support line)
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Assemble the site into dist/
        run: node scripts/build.mjs

      - name: Lint the HTML
        continue-on-error: true
        run: npx --yes htmlhint@1.1.4 "dist/*.html"

      - name: Check links (social networks are skipped because they block bots)
        continue-on-error: true
        run: >
          npx --yes linkinator@6.1.1 dist --recurse
          --skip "^https?://((www|web)\.)?(linkedin|facebook|instagram|threads|x)\.(com|net)"

      - name: Lighthouse report (mobile profile)
        continue-on-error: true
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
