# Checks a proposed change (pull request). The live site is never touched.
# GitHub Pages has no built-in preview, so the built site is attached to the
# run as a download you can open on your own computer.
name: Check pull request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Build, check and preview
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js (long-term support line)
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Assemble the site into dist/
        run: node scripts/build.mjs

      - name: Check links, manifest, service worker and security rules
        run: node scripts/check-site.mjs dist

      - name: Attach the built site as a download
        uses: actions/upload-artifact@v7
        with:
          name: site-preview
          path: dist
          retention-days: 14

      - name: Lint the HTML
        continue-on-error: true
        run: npx --yes htmlhint@1.1.4 "dist/*.html"

      - name: Lighthouse report (mobile profile)
        continue-on-error: true
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
