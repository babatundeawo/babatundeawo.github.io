# Keeps the GitHub Actions used by this repository up to date.
# Dependabot opens one pull request a week when newer versions are available.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
    groups:
      github-actions:
        patterns: ["*"]
